<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あるでんネット</title>
    <link rel="icon" href="./favicon.ico">
    <style>
        :root {
            --bg-dark: #f0f2f5;
            --accent-color: #28baa5;
            --accent-hover: #219d8b;
            --text-primary: #1a1a1b;
            --text-secondary: #65676b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            width: min(100%, 480px);
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 28px;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent-color);
            border: none;
            border-radius: 10px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(40, 186, 165, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 20px;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 24px;
            }

            .link-button {
                width: 100%;
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        .link-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(40, 186, 165, 0.4);
        }

        .link-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>あるでんネット</h1>
        <a href="./train-location/train-loc.html" class="link-button">
            有田電鉄 運行モニターを開く
        </a>
    </div>
</body>

</html>
